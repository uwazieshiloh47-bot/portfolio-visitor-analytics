name: Deploy visitor counter to AWS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/package-lambda.mjs"
      - "scripts/test-api.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: visitor-counter-dev-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      API_URL: ${{ vars.API_URL }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}

    steps:
      - name: Require the main branch
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Deployments must run from main; selected ref was ${GITHUB_REF}." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          for variable_name in \
            API_URL \
            AWS_REGION \
            AWS_ROLE_ARN \
            LAMBDA_FUNCTION_NAME
          do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Missing required repository variable: ${variable_name}" >&2
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check, test, and package Lambda
        run: npm run package:lambda

      - name: Upload reviewed deployment package
        uses: actions/upload-artifact@v7
        with:
          name: visitor-counter-lambda-${{ github.sha }}
          path: .artifacts/portfolio-visitor-api-dev.zip
          if-no-files-found: error
          retention-days: 14

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: GitHubActionsVisitorCounterDeploy

      - name: Confirm AWS identity
        run: aws sts get-caller-identity

      - name: Deploy Lambda code
        shell: bash
        run: |
          set -euo pipefail

          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --zip-file "fileb://.artifacts/portfolio-visitor-api-dev.zip" \
            --region "${AWS_REGION}" \
            --query '{FunctionName:FunctionName,CodeSize:CodeSize,LastModified:LastModified}'

      - name: Wait for Lambda deployment
        run: |
          aws lambda wait function-updated \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --region "${AWS_REGION}"

      - name: Verify Lambda status
        run: |
          aws lambda get-function-configuration \
            --function-name "${LAMBDA_FUNCTION_NAME}" \
            --region "${AWS_REGION}" \
            --query '{FunctionName:FunctionName,Runtime:Runtime,State:State,LastUpdateStatus:LastUpdateStatus}'

      - name: Run live API smoke test
        run: npm run test:api
